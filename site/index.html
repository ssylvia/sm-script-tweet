<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArcGIS StoryMaps — interactive story demo</title>
    <meta name="description" content="Explore an ArcGIS StoryMaps iframe embed and an experimental X Player Card.">
    <link rel="canonical" href="https://ssylvia.github.io/sm-script-tweet/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ssylvia.github.io/sm-script-tweet/">
    <meta property="og:title" content="ArcGIS StoryMaps — interactive story demo">
    <meta property="og:description" content="Open the demo to explore an interactive ArcGIS StoryMaps story.">
    <meta property="og:image" content="https://ssylvia.github.io/sm-script-tweet/card.png">
    <meta property="og:image:alt" content="ArcGIS StoryMaps interactive story demo">

    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@ssylvia">
    <meta name="twitter:title" content="ArcGIS StoryMaps — interactive story demo">
    <meta name="twitter:description" content="An experimental interactive story embed. Open the demo if X does not display a player.">
    <meta name="twitter:image" content="https://ssylvia.github.io/sm-script-tweet/card.png">
    <meta name="twitter:image:alt" content="ArcGIS StoryMaps interactive story demo">
    <meta name="twitter:player" content="https://ssylvia.github.io/sm-script-tweet/">
    <meta name="twitter:player:width" content="960">
    <meta name="twitter:player:height" content="600">

    <style>
      html, body, main { width: 100%; height: 100%; }
      body { margin: 0; color: #172b3a; background: #fff; font-family: system-ui, sans-serif; }
      noscript p { position: absolute; bottom: 0; margin: 0; padding: 0.75rem; background: #fff; }
      a { color: #005e95; }
      .storymaps-frame { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <main aria-label="Interactive ArcGIS StoryMaps story">
      <iframe
        class="storymaps-frame"
        src="https://storymaps.arcgis.com/stories/fffa28a9ea7447839ee9debfd9693bb8?autoplay=true"
        title="Interactive ArcGIS StoryMaps story"
        allow="autoplay"
        allowfullscreen
      ></iframe>
    </main>
    <noscript><p>JavaScript is disabled; showing the default story. <a href="https://storymaps.arcgis.com/stories/fffa28a9ea7447839ee9debfd9693bb8">Open the story directly</a>.</p></noscript>
    <script>
      const storyId = new URLSearchParams(window.location.search).get("storyId");
      if (storyId && /^[a-f0-9]{32}$/i.test(storyId)) {
        const frame = document.querySelector(".storymaps-frame");
        const storyUrl = new URL(frame.src);
        storyUrl.pathname = "/stories/" + storyId;
        if (frame.src !== storyUrl.href) {
          frame.src = storyUrl.href;
        }
      }
    </script>
  </body>
</html>
