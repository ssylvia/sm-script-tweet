    <meta property="og:url" content="https://ssylvia.github.io/sm-script-tweet/">
    <meta property="og:title" content="ArcGIS StoryMaps — interactive story demo">
    <meta property="og:description" content="Open the demo to explore an interactive ArcGIS StoryMaps story.">
    <meta property="og:site_name" content="ArcGIS StoryMaps demo">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://ssylvia.github.io/sm-script-tweet/card.png">
    <meta property="og:image:secure_url" content="https://ssylvia.github.io/sm-script-tweet/card.png">

    <style>
      html, body { width: 100%; height: 100%; }
      body { margin: 0; color: #172b3a; background: #fff; font-family: system-ui, sans-serif; }
      main { position: relative; width: 100%; height: 100%; }
      noscript p, #embed-status { position: absolute; bottom: 0; margin: 0; padding: 0.75rem; background: #fff; }
      a { color: #005e95; }
      .storymaps-frame { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <main aria-label="Interactive ArcGIS StoryMaps item">
      <p id="embed-status" role="status" hidden></p>
      <noscript>
        <iframe
          class="storymaps-frame"
          src="https://storymaps.arcgis.com/stories/fffa28a9ea7447839ee9debfd9693bb8?autoplay=true"
          title="Interactive ArcGIS StoryMaps story"
          allow="autoplay"
          allowfullscreen
        ></iframe>
        <p>JavaScript is disabled; showing the default story. <a href="https://storymaps.arcgis.com/stories/fffa28a9ea7447839ee9debfd9693bb8">Open the story directly</a>.</p>
      </noscript>
    </main>
    <script>
      const STORYMAP_COLLECTION_TYPEKEYWORD = "storymapcollection";
      const STORYMAP_BRIEFING_TYPEKEYWORD = "storymapbriefing";
      const STORYMAP_FRAME_TYPEKEYWORD = "storymapframe";
      const defaultStoryId = "fffa28a9ea7447839ee9debfd9693bb8";
      const params = new URLSearchParams(window.location.search);
      const requestedItemId = params.get("itemId") ?? params.get("storyId");
      const itemId = /^[a-f0-9]{32}$/i.test(requestedItemId || "")
        ? requestedItemId.toLowerCase()
        : defaultStoryId;

      async function loadItem() {
        const status = document.querySelector("#embed-status");
        status.textContent = "Loading ArcGIS StoryMaps item…";
        status.hidden = false;
        let route = "stories";
        let label = "story";
        let resolvedItemId = defaultStoryId;
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        try {
          const response = await fetch(
            "https://www.arcgis.com/sharing/rest/content/items/" + itemId + "?f=json",
            { credentials: "omit", signal: controller.signal }
          );
          if (!response.ok) throw new Error("Item lookup failed");
          const item = await response.json();
          if (!item || item.error || item.access !== "public") {
            throw new Error("Item is not publicly accessible");
          }
          const keywords = Array.isArray(item.typeKeywords) ? item.typeKeywords : [];
          if (keywords.includes(STORYMAP_COLLECTION_TYPEKEYWORD)) {
            route = "collections";
            label = "collection";
          } else if (keywords.includes(STORYMAP_BRIEFING_TYPEKEYWORD)) {
            route = "briefings";
            label = "briefing";
          } else if (keywords.includes(STORYMAP_FRAME_TYPEKEYWORD)) {
            route = "frames";
            label = "frame";
          }
          resolvedItemId = itemId;
          status.hidden = true;
        } catch {
          status.textContent = "Unable to load the public item. Showing the default story.";
        } finally {
          clearTimeout(timeout);
        }

        const frame = document.createElement("iframe");
        frame.className = "storymaps-frame";
        frame.src = "https://storymaps.arcgis.com/" + route + "/" + resolvedItemId + "?play=true";
        frame.title = "Interactive ArcGIS StoryMaps " + label;
        frame.allow = "autoplay";
        frame.allowFullscreen = true;
        document.querySelector("main").append(frame);
      }

      loadItem();
    </script>
  </body>
</html>
